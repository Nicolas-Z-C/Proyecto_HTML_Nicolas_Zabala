<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="vestGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shirtGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6e9f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="skinGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C4A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="faceHighlight2">
      <stop offset="0%" style="stop-color:#F5D9B8;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#E8C4A0;stop-opacity:0" />
    </radialGradient>
    
    <linearGradient id="hairGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ebe5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4cec6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glassesGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d3d3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombras -->
    <filter id="softShadow2">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glassReflection">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Fondo de taller -->
  <rect width="400" height="400" fill="url(#bgGradient2)"/>
  
  <!-- Elementos decorativos del taller -->
  <rect x="20" y="30" width="60" height="80" rx="3" fill="#8B7355" opacity="0.15"/>
  <rect x="320" y="50" width="50" height="100" rx="3" fill="#8B7355" opacity="0.15"/>
  <circle cx="80" cy="320" r="40" fill="#C4A875" opacity="0.1"/>
  <circle cx="340" cy="280" r="50" fill="#C4A875" opacity="0.1"/>
  
  <!-- Herramientas sutiles en el fondo -->
  <rect x="30" y="340" width="3" height="40" rx="1" fill="#8B7355" opacity="0.2"/>
  <rect x="38" y="340" width="3" height="40" rx="1" fill="#8B7355" opacity="0.2"/>
  <circle cx="360" cy="100" r="8" fill="#D4AF37" opacity="0.15"/>
  
  <!-- Cuello del chaleco -->
  <path d="M 140 380 L 125 300 L 145 270 L 155 250 L 200 240 L 245 250 L 255 270 L 275 300 L 260 380 Z" 
        fill="url(#vestGradient)" filter="url(#softShadow2)"/>
  
  <!-- Camisa clara -->
  <path d="M 155 265 L 165 245 L 200 240 L 235 245 L 245 265 L 248 310 L 152 310 Z" 
        fill="url(#shirtGradient2)"/>
  
  <!-- Cuello de camisa abierto (sin corbata, estilo artesano) -->
  <path d="M 180 248 L 185 240 L 200 238 L 215 240 L 220 248 L 215 258 L 200 252 L 185 258 Z" 
        fill="#d6e9f0" stroke="#c0d5dd" stroke-width="1"/>
  
  <!-- Detalles del chaleco -->
  <path d="M 165 275 L 160 290 L 165 330 L 175 325 Z" fill="#3a4556" opacity="0.8"/>
  <path d="M 235 275 L 240 290 L 235 330 L 225 325 Z" fill="#3a4556" opacity="0.8"/>
  
  <!-- Botones del chaleco -->
  <circle cx="200" cy="285" r="3.5" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
  <circle cx="200" cy="305" r="3.5" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
  <circle cx="200" cy="325" r="3.5" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Bolsillo con reloj de cadena -->
  <path d="M 215 290 Q 220 288 225 290 L 225 305 Q 220 307 215 305 Z" 
        fill="#3a4556" stroke="#2d3748" stroke-width="1"/>
  <circle cx="228" cy="297" r="6" fill="#D4AF37" opacity="0.8" stroke="#B8941F" stroke-width="1"/>
  <path d="M 225 297 Q 223 292 220 290" stroke="#B8941F" stroke-width="1.5" fill="none"/>
  
  <!-- Cuello -->
  <ellipse cx="200" cy="245" rx="20" ry="26" fill="url(#skinGradient2)"/>
  
  <!-- Cara con rasgos maduros -->
  <ellipse cx="200" cy="175" rx="62" ry="72" fill="url(#skinGradient2)" filter="url(#softShadow2)"/>
  
  <!-- Highlight facial -->
  <ellipse cx="200" cy="165" rx="42" ry="48" fill="url(#faceHighlight2)"/>
  
  <!-- Orejas -->
  <ellipse cx="142" cy="180" rx="11" ry="17" fill="#D4A574"/>
  <ellipse cx="258" cy="180" rx="11" ry="17" fill="#D4A574"/>
  
  <!-- Cabello gris (artesano mayor) -->
  <path d="M 138 125 Q 135 110 145 95 Q 160 80 200 78 Q 240 80 255 95 Q 265 110 262 125 L 258 145 Q 248 120 200 118 Q 152 120 142 145 Z" 
        fill="url(#hairGradient2)"/>
  
  <!-- Canas y textura del cabello -->
  <path d="M 150 100 Q 170 90 190 88" stroke="#b8bec4" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 250 100 Q 230 90 210 88" stroke="#b8bec4" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 200 78 Q 185 82 175 90" stroke="#d1d5db" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 200 78 Q 215 82 225 90" stroke="#d1d5db" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Cejas grises más pobladas -->
  <path d="M 163 152 Q 173 148 183 150" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 217 150 Q 227 148 237 152" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Gafas de lectura -->
  <!-- Marco izquierdo -->
  <circle cx="172" cy="168" r="16" fill="none" stroke="url(#glassesGradient)" stroke-width="2.5"/>
  <ellipse cx="172" cy="168" rx="15" ry="14" fill="#ffffff" opacity="0.15"/>
  <path d="M 170 160 L 174 162" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Marco derecho -->
  <circle cx="228" cy="168" r="16" fill="none" stroke="url(#glassesGradient)" stroke-width="2.5"/>
  <ellipse cx="228" cy="168" rx="15" ry="14" fill="#ffffff" opacity="0.15"/>
  <path d="M 226 160 L 230 162" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Puente de las gafas -->
  <path d="M 188 168 Q 200 165 212 168" stroke="url(#glassesGradient)" stroke-width="2.5" fill="none"/>
  
  <!-- Patillas de las gafas -->
  <path d="M 156 168 L 145 172" stroke="url(#glassesGradient)" stroke-width="2" fill="none"/>
  <path d="M 244 168 L 255 172" stroke="url(#glassesGradient)" stroke-width="2" fill="none"/>
  
  <!-- Ojos detrás de las gafas (mirada sabia) -->
  <ellipse cx="172" cy="170" rx="6" ry="8" fill="#4a5568"/>
  <ellipse cx="228" cy="170" rx="6" ry="8" fill="#4a5568"/>
  <circle cx="173" cy="168" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="229" cy="168" r="2" fill="#ffffff" opacity="0.7"/>
  
  <!-- Nariz -->
  <path d="M 200 168 L 199 188 Q 199 192 200 194 Q 201 192 201 188 L 200 168" 
        fill="none" stroke="#C89B68" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="196" cy="192" rx="3" ry="2.5" fill="#C89B68" opacity="0.5"/>
  <ellipse cx="204" cy="192" rx="3" ry="2.5" fill="#C89B68" opacity="0.5"/>
  
  <!-- Líneas de expresión (arrugas de experiencia) -->
  <path d="M 165 175 Q 168 180 170 185" stroke="#B8956A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 235 175 Q 232 180 230 185" stroke="#B8956A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 185 198 Q 190 200 195 198" stroke="#B8956A" stroke-width="0.6" fill="none" opacity="0.3"/>
  <path d="M 205 198 Q 210 200 215 198" stroke="#B8956A" stroke-width="0.6" fill="none" opacity="0.3"/>
  
  <!-- Sonrisa cálida y sabia -->
  <path d="M 178 208 Q 200 215 222 208" 
        stroke="#8B6F5C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 178 208 Q 200 213 222 208" 
        stroke="#D4A89A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Líneas de sonrisa (patas de gallo) -->
  <path d="M 155 172 Q 152 176 150 180" stroke="#B8956A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 155 176 Q 153 180 152 184" stroke="#B8956A" stroke-width="0.6" fill="none" opacity="0.3"/>
  <path d="M 245 172 Q 248 176 250 180" stroke="#B8956A" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 245 176 Q 247 180 248 184" stroke="#B8956A" stroke-width="0.6" fill="none" opacity="0.3"/>
  
  <!-- Sombras faciales -->
  <ellipse cx="168" cy="185" rx="14" ry="7" fill="#000000" opacity="0.06"/>
  <ellipse cx="232" cy="185" rx="14" ry="7" fill="#000000" opacity="0.06"/>
  <ellipse cx="200" cy="220" rx="18" ry="4" fill="#000000" opacity="0.05"/>
  
  <!-- Hombros del chaleco -->
  <ellipse cx="125" cy="310" rx="32" ry="42" fill="url(#vestGradient)"/>
  <ellipse cx="275" cy="310" rx="32" ry="42" fill="url(#vestGradient)"/>
  
  <!-- Detalles de costura del chaleco -->
  <path d="M 170 280 L 172 350" stroke="#2d3748" stroke-width="0.5" opacity="0.4"/>
  <path d="M 230 280 L 228 350" stroke="#2d3748" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Insignia o pin de antigüedad (sutil) -->
  <circle cx="165" cy="270" r="6" fill="#D4AF37" opacity="0.7" stroke="#B8941F" stroke-width="1"/>
  <text x="165" y="273" font-family="Arial" font-size="8" fill="#1a202c" text-anchor="middle" font-weight="bold">35</text>
  
</svg>